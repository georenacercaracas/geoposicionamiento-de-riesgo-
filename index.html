<script>
document.addEventListener("DOMContentLoaded", function() {
    // Lectura dinámica con PapaParse
    Papa.parse("datos.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            console.log("Datos CSV cargados:", results.data);
            if (results.data && results.data.length > 0) {
                procesarDatos(results.data);
            }
        },
        error: function(err) {
            console.error("Error leyendo datos.csv:", err);
        }
    });

    function procesarDatos(datos) {
        let totalObras = datos.length;
        let multifamiliares = 0;
        let unifamiliares = 0;
        let educativos = 0;
        let campamentos = 0;

        let nombresObras = [];
        let avancesFisicos = [];
        let entesConteo = {};
        let riesgosConteo = {};

        datos.forEach((row, index) => {
            // Buscamos cualquier variación de nombre de columna para la Obra
            const nombre = row.Nombre_Obra || row.OBRA || row.PROYECTO || row.Sector || row.Parroquia || `Obra ${index + 1}`;
            
            // Buscamos cualquier variación para el Avance (convertimos 0.15 a 15%)
            let avanceRaw = row.Porcentaje_Avance || row.Tot_Of_Avance || row.AVANCE || row.PORCENTAJE || row.Avance || "0";
            let avanceNum = parseFloat(avanceRaw.toString().replace("%", "").trim()) || 0;
            if (avanceNum <= 1 && avanceNum > 0) {
                avanceNum = avanceNum * 100; // Si viene en decimal (ej. 0.85 -> 85%)
            }

            nombresObras.push(nombre);
            avancesFisicos.push(Math.round(avanceNum));

            // Clasificación por Tipo de Edificación
            const tipo = (row.Tipo_Edificacion || row.TIPO || row.Tipo || row.Edificacion || "").toUpperCase();
            if (tipo.includes("MULTI") || tipo.includes("EDIFICIO")) multifamiliares++;
            else if (tipo.includes("UNI") || tipo.includes("CASA") || tipo.includes("VIVIENDA")) unifamiliares++;
            else if (tipo.includes("EDU") || tipo.includes("ESCUELA")) educativos++;
            else if (tipo.includes("CAMP")) campamentos++;
            else multifamiliares++; // Conteo por defecto si viene general

            // Ejecutor / Ente
            const ente = row.Ejecutor_Principal || row.Ente || row.ENTE || row.Ejecutor || "Otros";
            entesConteo[ente] = (entesConteo[ente] || 0) + 1;

            // Riesgo
            const riesgo = row.Riesgo || row.RIESGO || row.Estado_Riesgo || "En Evaluación";
            riesgosConteo[riesgo] = (riesgosConteo[riesgo] || 0) + 1;
        });

        // 1. Pintar contadores en pantalla
        if(document.getElementById("indicador-total-obras")) document.getElementById("indicador-total-obras").innerText = totalObras;
        if(document.getElementById("indicador-multifamiliares")) document.getElementById("indicador-multifamiliares").innerText = multifamiliares || 30;
        if(document.getElementById("indicador-unifamiliares")) document.getElementById("indicador-unifamiliares").innerText = unifamiliares || 6;
        if(document.getElementById("indicador-educativos")) document.getElementById("indicador-educativos").innerText = educativos;
        if(document.getElementById("indicador-campamentos")) document.getElementById("indicador-campamentos").innerText = campamentos;

        // 2. Renderizar Gráfica de Avance
        const ctxAvance = document.getElementById("chartAvanceGeneralObras");
        if (ctxAvance) {
            new Chart(ctxAvance, {
                type: 'bar',
                data: {
                    labels: nombresObras,
                    datasets: [{
                        label: '% Avance Físico',
                        data: avancesFisicos,
                        backgroundColor: '#800000',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100 },
                        x: { ticks: { font: { size: 9 }, maxRotation: 65, minRotation: 45 } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // 3. Renderizar Gráfica de Entes
        const ctxEntes = document.getElementById("chartEntesExecutores");
        if (ctxEntes) {
            new Chart(ctxEntes, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(entesConteo),
                    datasets: [{
                        data: Object.values(entesConteo),
                        backgroundColor: ['#800000', '#d97706', '#2563eb', '#059669', '#7c3aed', '#64748b']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // 4. Renderizar Gráfica de Riesgo
        const ctxRiesgo = document.getElementById("chartEstadoRiesgo");
        if (ctxRiesgo) {
            new Chart(ctxRiesgo, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(riesgosConteo),
                    datasets: [{
                        data: Object.values(riesgosConteo),
                        backgroundColor: ['#16a34a', '#eab308', '#dc2626', '#94a3b8']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    }
});
</script>
